name: Deploy Angular to gh-pages

on:
  push:
    branches:
      - blank-angular-app
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:pages

      - name: Disable Jekyll
        run: touch dist/blank-angular-app/browser/.nojekyll

      - name: Create SPA fallback
        run: cp dist/blank-angular-app/browser/index.html dist/blank-angular-app/browser/404.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist/blank-angular-app/browser
